<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>התנדבות ✦ Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=DM+Sans:wght@400;500;600;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffd6e8; --bg2: #e3d2ff; --bg3: #cdeffd;
    --ink: #2b2140; --ink-soft: #6c5f86; --card: rgba(255,255,255,.72);
    --card-border: rgba(255,255,255,.9); --accent: #7b5cff; --accent-2: #ff7eb6;
    --good: #2fbf8f; --bad: #ff6b8a; --chip: rgba(255,255,255,.55);
    --shadow: 0 30px 60px -20px rgba(80,50,140,.35);
  }
  [data-theme="mint"] {
    --bg1: #d9fff1; --bg2: #e4f6ff; --bg3: #fff6cc;
    --ink: #173a32; --ink-soft: #4f776d; --accent: #10a37f; --accent-2: #ffb400;
    --shadow: 0 30px 60px -20px rgba(16,120,90,.3);
  }
  [data-theme="peach"] {
    --bg1: #ffe1c9; --bg2: #ffd1dc; --bg3: #fff2b3;
    --ink: #4a2a1a; --ink-soft: #8a6251; --accent: #ff6f4e; --accent-2: #ff9ecb;
    --shadow: 0 30px 60px -20px rgba(180,80,40,.3);
  }
  [data-theme="midnight"] {
    --bg1: #1c1538; --bg2: #2a1a4f; --bg3: #0e2a4a;
    --ink: #f3ecff; --ink-soft: #b7a9d6; --card: rgba(255,255,255,.08);
    --card-border: rgba(255,255,255,.18); --accent: #b48bff; --accent-2: #ff8ad4;
    --chip: rgba(255,255,255,.1); --shadow: 0 30px 60px -20px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "DM Sans", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
    background-attachment: fixed; min-height: 100vh; overflow-x: hidden;
    transition: background .6s ease, color .4s ease;
  }
  .blob {
    position: fixed; border-radius: 50%; filter: blur(70px); opacity: .55; z-index: 0;
    pointer-events: none; animation: drift 18s ease-in-out infinite alternate;
  }
  .blob.a { width: 420px; height: 420px; background: var(--accent-2); top: -120px; left: -120px; }
  .blob.b { width: 360px; height: 360px; background: var(--accent); bottom: -140px; right: -100px; animation-delay: -7s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px, 60px) scale(1.15); } }

  .app { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 28px 16px 60px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: "Fraunces", serif; font-weight: 500; font-size: clamp(26px, 5vw, 38px); margin: 0;
    letter-spacing: -.02em; line-height: 1.1;
  }
  h1 .he { font-family: "Heebo", sans-serif; font-weight: 700; }
  h1 .spark { color: var(--accent); }
  .sub { color: var(--ink-soft); font-size: 14px; margin-top: 4px; }

  .themes { display: flex; gap: 8px; }
  .theme-dot {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8);
    cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.15); transition: transform .2s;
  }
  .theme-dot:hover { transform: scale(1.15); }
  .theme-dot.on { outline: 3px solid var(--accent); outline-offset: 2px; }

  .tabs { display: flex; gap: 6px; margin: 22px 0 14px; background: var(--chip); padding: 6px; border-radius: 999px; backdrop-filter: blur(10px); width: max-content; max-width: 100%; }
  .tab {
    border: 0; background: transparent; color: var(--ink-soft); font: 600 14px "DM Sans", sans-serif;
    padding: 9px 16px; border-radius: 999px; cursor: pointer; transition: all .25s;
  }
  .tab.on { background: var(--accent); color: #fff; box-shadow: 0 8px 20px -8px var(--accent); }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .btn {
    border: 1px solid var(--card-border); background: var(--card); color: var(--ink);
    font: 600 13px "DM Sans", sans-serif; padding: 9px 14px; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(10px); transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px -8px rgba(0,0,0,.3); }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.ghost { background: transparent; }
  .btn.good { background: var(--good); color: #fff; border-color: transparent; }
  .btn.bad { background: var(--bad); color: #fff; border-color: transparent; }
  .btn.big { padding: 14px 26px; font-size: 15px; }

  .progress { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; margin: 6px 0 18px; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; border-radius: 999px; }
  .meta { display: flex; justify-content: space-between; color: var(--ink-soft); font-size: 13px; font-weight: 500; }

  /* Flashcard */
  .scene { perspective: 1400px; }
  .card {
    position: relative; width: 100%; aspect-ratio: 16 / 10; min-height: 260px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 28px;
    box-shadow: var(--shadow); backdrop-filter: blur(16px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px; text-align: center;
  }
  .face.back { transform: rotateY(180deg); }
  .face .label { position: absolute; top: 18px; left: 22px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  .face .hint { position: absolute; bottom: 16px; color: var(--ink-soft); font-size: 12px; }
  .word { font-size: clamp(30px, 7vw, 56px); line-height: 1.15; font-weight: 500; }
  .word.he { font-family: "Heebo", sans-serif; direction: rtl; font-weight: 500; }
  .word.en { font-family: "Fraunces", serif; font-style: italic; }
  .star { position: absolute; top: 14px; right: 18px; font-size: 22px; cursor: pointer; opacity: .35; transition: transform .2s, opacity .2s; }
  .star.on { opacity: 1; transform: scale(1.2); }
  .pop { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.96); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }

  .actions { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .keys { color: var(--ink-soft); font-size: 12px; text-align: center; margin-top: 18px; }
  kbd { background: var(--chip); border-radius: 6px; padding: 2px 7px; font-family: inherit; font-weight: 600; border: 1px solid var(--card-border); }

  /* Quiz */
  .quiz-q { background: var(--card); border: 1px solid var(--card-border); border-radius: 28px; padding: 40px 24px; text-align: center; box-shadow: var(--shadow); backdrop-filter: blur(16px); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  @media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
  .choice {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 18px 14px;
    font-size: 18px; cursor: pointer; text-align: center; transition: all .2s; backdrop-filter: blur(10px); color: var(--ink);
    font-family: "DM Sans", sans-serif;
  }
  .choice.he { font-family: "Heebo", sans-serif; direction: rtl; font-size: 22px; }
  .choice:hover { transform: translateY(-2px); border-color: var(--accent); }
  .choice.right { background: var(--good); color: #fff; border-color: transparent; }
  .choice.wrong { background: var(--bad); color: #fff; border-color: transparent; animation: shake .35s; }
  .choice.dim { opacity: .5; pointer-events: none; }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }
  .streak { font-family: "Fraunces", serif; font-size: 15px; color: var(--ink-soft); }
  .streak b { color: var(--accent); font-size: 20px; }

  /* List */
  .list { display: grid; gap: 8px; }
  .row {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px 16px; backdrop-filter: blur(10px);
  }
  .row .he { font-family: "Heebo", sans-serif; direction: rtl; text-align: right; font-size: 19px; font-weight: 500; }
  .row .en { font-family: "Fraunces", serif; font-style: italic; font-size: 16px; color: var(--ink-soft); }
  .row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--chip); }
  .row .dot.known { background: var(--good); }
  .row .dot.starred { background: var(--accent-2); }
  .search { width: 100%; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--card-border); background: var(--card); color: var(--ink); font: 500 15px "DM Sans", sans-serif; margin-bottom: 12px; outline: none; }

  /* Done screen */
  .done { text-align: center; padding: 50px 20px; background: var(--card); border-radius: 28px; border: 1px solid var(--card-border); box-shadow: var(--shadow); backdrop-filter: blur(16px); }
  .done h2 { font-family: "Fraunces", serif; font-weight: 500; font-size: 34px; margin: 0 0 8px; }
  .done p { color: var(--ink-soft); margin: 0 0 20px; }
  .hidden { display: none !important; }

  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>
<canvas id="confetti"></canvas>

<div class="app">
  <header>
    <div>
      <h1><span class="he">התנדבות</span> <span class="spark">✦</span> Volunteering</h1>
      <div class="sub" id="subtitle">82 words · Hebrew ↔ English</div>
    </div>
    <div class="themes" title="pick a vibe">
      <div class="theme-dot on" data-theme="lavender" style="background:linear-gradient(135deg,#ffd6e8,#e3d2ff,#cdeffd)"></div>
      <div class="theme-dot" data-theme="mint" style="background:linear-gradient(135deg,#d9fff1,#fff6cc)"></div>
      <div class="theme-dot" data-theme="peach" style="background:linear-gradient(135deg,#ffe1c9,#ffd1dc)"></div>
      <div class="theme-dot" data-theme="midnight" style="background:linear-gradient(135deg,#1c1538,#0e2a4a)"></div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-mode="study">✦ Study</button>
    <button class="tab" data-mode="quiz">⚡ Quiz</button>
    <button class="tab" data-mode="list">☰ All words</button>
  </div>

  <!-- STUDY MODE -->
  <section id="study">
    <div class="toolbar">
      <button class="btn" id="dirBtn">Hebrew → English</button>
      <button class="btn" id="shuffleBtn">⇄ Shuffle</button>
      <button class="btn" id="starsOnlyBtn">★ Starred only</button>
      <button class="btn ghost" id="resetBtn">Reset progress</button>
    </div>
    <div class="meta"><span id="counter">1 / 82</span><span id="knownCount">0 known</span></div>
    <div class="progress"><div id="bar"></div></div>

    <div id="studyArea">
      <div class="scene">
        <div class="card" id="card">
          <div class="face front">
            <span class="label" id="frontLabel">Hebrew</span>
            <span class="star" id="star">★</span>
            <div class="word" id="frontWord"></div>
            <span class="hint">tap or press space to flip</span>
          </div>
          <div class="face back">
            <span class="label" id="backLabel">English</span>
            <div class="word" id="backWord"></div>
            <span class="hint">how did you do?</span>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn bad big" id="againBtn">✗ Still learning</button>
        <button class="btn good big" id="gotBtn">✓ Got it</button>
      </div>
      <div class="nav">
        <button class="btn ghost" id="prevBtn">← Back</button>
        <button class="btn ghost" id="nextBtn">Skip →</button>
      </div>
      <div class="keys"><kbd>space</kbd> flip &nbsp; <kbd>←</kbd> <kbd>→</kbd> move &nbsp; <kbd>1</kbd> still learning &nbsp; <kbd>2</kbd> got it &nbsp; <kbd>s</kbd> star</div>
    </div>

    <div id="doneArea" class="done hidden">
      <h2 id="doneTitle">You did it ✨</h2>
      <p id="doneText"></p>
      <button class="btn primary big" id="reviewBtn">Review the tricky ones</button>
      <button class="btn big" id="restartBtn">Start over</button>
    </div>
  </section>

  <!-- QUIZ MODE -->
  <section id="quiz" class="hidden">
    <div class="toolbar">
      <button class="btn" id="quizDirBtn">Hebrew → English</button>
      <span class="streak">streak <b id="streak">0</b> · best <b id="best">0</b></span>
    </div>
    <div class="quiz-q"><div class="word" id="quizWord"></div></div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- LIST MODE -->
  <section id="list" class="hidden">
    <input class="search" id="search" placeholder="search a word… / חפשי מילה">
    <div class="list" id="rows"></div>
  </section>
</div>

<script>
// Cards from the Quizlet set "התנדבות" (82 cards).
// The set left the English side of מצב רוח blank; "mood" was added here.
const CARDS = [
["התנדבות","volunteering"],["להתנדב","to volunteer to"],["מחויבות","commitment, obligation"],
["גן ילדים","kindergarten"],["סייעת","assistant"],["גננת","kindergarten teacher"],
["לשלב","to combine"],["לארגן","to organize"],["להשגיח","to supervise"],
["להשתולל","to go wild"],["לעודד","to encourage"],["שכבה","grade"],
["יתום","orphan"],["עומס לימודים","study load"],["לוותר","to give up"],
["לתרום","to contribute"],["נטל","burden"],["מחמאה","compliment"],
["סיפוק","satisfaction"],["תחושת סיפוק","feeling of satisfaction"],["להמליץ","to recommend"],
["בני נוער","teenagers"],["להשפיע, משפיע","to influence"],["האם","is it"],
["איך/כיצד","how"],["למה/מדוע","why"],["איזה","which"],
["כמה","how many, how much"],["מי","who"],["מה","what"],
["מתי","when (question)"],["איפה/היכן","where"],["לאן","where to"],
["עדין / עדינות","gentle / gentleness"],["סבלן / סבלנות","patient, patience"],["חברותי / חברותיות","friendly / friendliness"],
["רציני / רצינות","serious / seriousness"],["למדן / למדנות","studious / studiousness"],["אחראי / אחריות","responsible / responsibility"],
["ספונטני / ספונטניות","spontaneous / spontaneity"],["רחמן","merciful"],["נעים","pleasant, nice"],
["קשוב","attentive"],["מתוכנן","planned"],["מתחשב","considerate"],
["נחמד","nice"],["נדיב","generous"],["אמפטי","empathetic"],
["מעורבות","involvement"],["מחקר","study, research"],["מוכיח","proves"],
["התאבדות","suicide"],["מנהיגות","leadership"],["סיכוי","chance, possibility"],
["דיכאון","depression"],["חרדה","anxiety"],["יציאה מאזור הנוחות","out of comfort zone"],
["יכולות","abilities"],["מסוגלות","capability"],["להתמודד","to cope"],
["כישלון","failure"],["בריאות נפשית","mental health"],["בריאות פיזית","physical health"],
["מצב רוח","mood"],["ראיון","interview"],["מראיין","interviewer"],
["מרואיין","interviewee"],["ניסיון","experience"],["ארגון","organization"],
["שאלון","questionnaire"],["מועמד","candidate"],["מתאים","suitable"],
["המלצות","recommendations"],["להתקבל","to be accepted"],["התחייבות","commitment"],
["תמיד","always"],["לעיתים, לפעמים","sometimes"],["אף פעם","never"],
["לעיתים קרובות","often"],["לפני","before"],["אחרי","after"],["לאחר מכן","afterwards"]
].map((c, i) => ({ id: i, he: c[0], en: c[1] }));

// ---------- persistent state ----------
const save = (k, v) => localStorage.setItem('hitnadvut_' + k, JSON.stringify(v));
const load = (k, d) => { try { const v = localStorage.getItem('hitnadvut_' + k); return v ? JSON.parse(v) : d; } catch { return d; } };
let known = new Set(load('known', []));
let starred = new Set(load('starred', []));
let heFirst = load('heFirst', true);
let best = load('best', 0);
document.documentElement.dataset.theme = load('theme', 'lavender');

const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- themes & tabs ----------
document.querySelectorAll('.theme-dot').forEach(d => {
  d.classList.toggle('on', d.dataset.theme === document.documentElement.dataset.theme);
  d.onclick = () => {
    document.documentElement.dataset.theme = d.dataset.theme; save('theme', d.dataset.theme);
    document.querySelectorAll('.theme-dot').forEach(x => x.classList.toggle('on', x === d));
  };
});
let mode = 'study';
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  mode = t.dataset.mode;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  ['study', 'quiz', 'list'].forEach(m => $(m).classList.toggle('hidden', m !== mode));
  if (mode === 'quiz') nextQuestion();
  if (mode === 'list') renderList();
});

// ---------- study mode ----------
let deck = [], pos = 0, flipped = false, starsOnly = false, missedThisRound = [];

function buildDeck(cards) {
  deck = cards.slice(); pos = 0; missedThisRound = [];
  $('doneArea').classList.add('hidden'); $('studyArea').classList.remove('hidden');
  showCard();
}
function startRound() {
  const pool = CARDS.filter(c => !known.has(c.id) && (!starsOnly || starred.has(c.id)));
  if (pool.length === 0) return finishRound();
  buildDeck(pool);
}
function showCard() {
  const c = deck[pos];
  flipped = false; $('card').classList.remove('flipped');
  const front = heFirst ? c.he : c.en, back = heFirst ? c.en : c.he;
  $('frontWord').textContent = front; $('backWord').textContent = back;
  $('frontWord').className = 'word ' + (heFirst ? 'he' : 'en');
  $('backWord').className = 'word ' + (heFirst ? 'en' : 'he');
  $('frontLabel').textContent = heFirst ? 'Hebrew' : 'English';
  $('backLabel').textContent = heFirst ? 'English' : 'Hebrew';
  $('star').classList.toggle('on', starred.has(c.id));
  $('card').classList.remove('pop'); void $('card').offsetWidth; $('card').classList.add('pop');
  $('counter').textContent = `${pos + 1} / ${deck.length}`;
  updateMeta();
}
function updateMeta() {
  $('knownCount').textContent = `${known.size} of ${CARDS.length} known`;
  $('bar').style.width = (100 * known.size / CARDS.length) + '%';
  $('dirBtn').textContent = $('quizDirBtn').textContent = heFirst ? 'Hebrew → English' : 'English → Hebrew';
  $('starsOnlyBtn').textContent = (starsOnly ? '★ Starred only ✓' : '★ Starred only');
}
function flip() { flipped = !flipped; $('card').classList.toggle('flipped', flipped); }
function advance() { pos++; if (pos >= deck.length) finishRound(); else showCard(); }
function mark(gotIt) {
  const c = deck[pos];
  if (gotIt) known.add(c.id); else { known.delete(c.id); missedThisRound.push(c); }
  save('known', [...known]);
  setTimeout(advance, flipped ? 250 : 0);
}
function finishRound() {
  $('studyArea').classList.add('hidden'); $('doneArea').classList.remove('hidden');
  const allDone = known.size === CARDS.length;
  $('doneTitle').textContent = allDone ? 'All 82 words. Legend. ✨' : 'Round complete ✨';
  $('doneText').textContent = allDone
    ? 'You know every word in the set. Go celebrate.'
    : `${missedThisRound.length} still learning · ${known.size} known so far`;
  $('reviewBtn').classList.toggle('hidden', missedThisRound.length === 0);
  updateMeta();
  if (allDone || missedThisRound.length === 0) confetti();
}

$('card').onclick = e => { if (e.target.id !== 'star') flip(); };
$('star').onclick = () => {
  const c = deck[pos];
  starred.has(c.id) ? starred.delete(c.id) : starred.add(c.id);
  save('starred', [...starred]); $('star').classList.toggle('on', starred.has(c.id));
};
$('gotBtn').onclick = () => mark(true);
$('againBtn').onclick = () => mark(false);
$('nextBtn').onclick = advance;
$('prevBtn').onclick = () => { if (pos > 0) { pos--; showCard(); } };
$('shuffleBtn').onclick = () => { shuffle(deck); pos = 0; showCard(); };
$('dirBtn').onclick = $('quizDirBtn').onclick = () => { heFirst = !heFirst; save('heFirst', heFirst); showCard(); if (mode === 'quiz') nextQuestion(); };
$('starsOnlyBtn').onclick = () => { starsOnly = !starsOnly; startRound(); };
$('resetBtn').onclick = () => { known.clear(); save('known', []); startRound(); };
$('reviewBtn').onclick = () => buildDeck(shuffle(missedThisRound.slice()));
$('restartBtn').onclick = startRound;

document.addEventListener('keydown', e => {
  if (mode !== 'study' || $('studyArea').classList.contains('hidden') || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') advance();
  else if (e.key === 'ArrowLeft') $('prevBtn').click();
  else if (e.key === '1') mark(false);
  else if (e.key === '2') mark(true);
  else if (e.key === 's') $('star').click();
});

// ---------- quiz mode ----------
let streak = 0, current = null;
function nextQuestion() {
  const pool = shuffle(CARDS.slice());
  current = pool[0];
  const options = shuffle([current, ...pool.slice(1, 4)]);
  $('quizWord').textContent = heFirst ? current.he : current.en;
  $('quizWord').className = 'word ' + (heFirst ? 'he' : 'en');
  $('choices').innerHTML = '';
  options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice ' + (heFirst ? 'en' : 'he');
    b.textContent = heFirst ? o.en : o.he;
    b.onclick = () => answer(b, o);
    $('choices').appendChild(b);
  });
  $('streak').textContent = streak; $('best').textContent = best;
}
function answer(btn, o) {
  const right = o.id === current.id;
  document.querySelectorAll('.choice').forEach(c => c.classList.add('dim'));
  btn.classList.remove('dim'); btn.classList.add(right ? 'right' : 'wrong');
  if (right) { streak++; if (streak > best) { best = streak; save('best', best); } if (streak % 10 === 0) confetti(); }
  else {
    streak = 0;
    document.querySelectorAll('.choice').forEach(c => { if (c.textContent === (heFirst ? current.en : current.he)) { c.classList.remove('dim'); c.classList.add('right'); } });
  }
  setTimeout(nextQuestion, right ? 650 : 1300);
}

// ---------- list mode ----------
function renderList() {
  const q = $('search').value.trim().toLowerCase();
  $('rows').innerHTML = '';
  CARDS.filter(c => !q || c.he.includes(q) || c.en.toLowerCase().includes(q)).forEach(c => {
    const r = document.createElement('div'); r.className = 'row';
    const dot = starred.has(c.id) ? 'starred' : known.has(c.id) ? 'known' : '';
    r.innerHTML = `<div class="en">${c.en}</div><div class="dot ${dot}"></div><div class="he">${c.he}</div>`;
    $('rows').appendChild(r);
  });
}
$('search').oninput = renderList;

// ---------- confetti ----------
function confetti() {
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#7b5cff', '#ff7eb6', '#ffd166', '#2fbf8f', '#4cc9f0'];
  const bits = Array.from({ length: 160 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
    r: 4 + Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)],
    vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, a: Math.random() * Math.PI
  }));
  let t = 0;
  (function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.y += b.vy; b.x += b.vx; b.a += .1;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c;
      ctx.fillRect(-b.r / 2, -b.r / 2, b.r, b.r * .6); ctx.restore();
    });
    if (++t < 180) requestAnimationFrame(draw); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

// ---------- go ----------
startRound();
